log_format researchdesk_safe escape=json '{"requestId":"$request_id","method":"$request_method","status":$status,"duration":$request_time}';
server {
    listen 8443 ssl;
    ssl_certificate /run/tls/fullchain.pem;
    ssl_certificate_key /run/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    server_name _;
    access_log /var/log/nginx/access.log researchdesk_safe;
    error_log /var/log/nginx/error.log crit;
    client_max_body_size 22m;
    error_page 413 = @upload_too_large;
    location @upload_too_large {
        default_type application/json;
        add_header Cache-Control no-store always;
        return 413 '{"code":"UPLOAD_TOO_LARGE","message":"Upload exceeds the configured size limit; split the file and retry.","requestId":"$request_id"}';
    }
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 310s;
    }
    location / {
        proxy_pass http://web:8080;
        proxy_set_header Host $host;
    }
}
