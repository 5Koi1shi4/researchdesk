name: ${COMPOSE_PROJECT_NAME:-researchdesk-delivery}
services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-trixie@sha256:724a4041afdb1750446e3f6b5cfa8f3b0ac5a2cf538ddfa6bfee4f94c2fa85c6
    environment:
      POSTGRES_DB: researchdesk
      POSTGRES_USER: researchdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-researchdesk-dev-only}
      BUSINESS_DATABASE_PASSWORD: ${BUSINESS_DATABASE_PASSWORD:-researchdesk-business-dev-only}
      RETRIEVAL_DATABASE_PASSWORD: ${RETRIEVAL_DATABASE_PASSWORD:-researchdesk-retrieval-dev-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./provision-roles.sql:/opt/researchdesk/provision-roles.sql:ro
      - ./provision-roles.sh:/docker-entrypoint-initdb.d/10-researchdesk-roles.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U researchdesk -d researchdesk"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: researchdesk-delivery-minio:2025-10-15-fixed
    build: {context: ./minio}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    command: [server, /data, --console-address, ':9001']
    environment:
      MINIO_BROWSER: "off"
      # Dedicated ResearchDesk instance: expiry applies to its private buckets only.
      MINIO_API_STALE_UPLOADS_EXPIRY: 24h
      MINIO_API_STALE_UPLOADS_CLEANUP_INTERVAL: 1h
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-researchdesk-dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-researchdesk-dev-only}
    volumes: [minio-data:/data]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9000/minio/health/live]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    image: ${RESEARCHDESK_IMAGE_PREFIX:-researchdesk-delivery}-api:local
    build: {context: .., dockerfile: apps/api/Dockerfile}
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/researchdesk
      DATABASE_USER: researchdesk_business
      DATABASE_PASSWORD: ${BUSINESS_DATABASE_PASSWORD:-researchdesk-business-dev-only}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-researchdesk-dev}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-researchdesk-dev-only}
      STORAGE_BUCKET: researchdesk-documents
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-20971520}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-200}
      MAX_DOCUMENTS_PER_PROJECT: ${MAX_DOCUMENTS_PER_PROJECT:-50}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_SECONDS: ${SESSION_SECONDS:-86400}
      AI_BASE_URL: http://ai:8000
      USAGE_PRICE_MODEL: ${USAGE_PRICE_MODEL:-}
      USAGE_INPUT_PRICE_PER_MILLION: ${USAGE_INPUT_PRICE_PER_MILLION:-}
      USAGE_OUTPUT_PRICE_PER_MILLION: ${USAGE_OUTPUT_PRICE_PER_MILLION:-}
      USAGE_PRICE_DATE: ${USAGE_PRICE_DATE:-}
      USAGE_PRICE_CURRENCY: ${USAGE_PRICE_CURRENCY:-}
      GENERATION_MODE: ${GENERATION_MODE:-demo}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-researchdesk-internal-dev-token-change-before-production}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      minio: {condition: service_healthy}
  migrate:
    image: ${RESEARCHDESK_IMAGE_PREFIX:-researchdesk-delivery}-api:local
    build: {context: .., dockerfile: apps/api/Dockerfile}
    command: [--migrate-only]
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/researchdesk
      DATABASE_USER: researchdesk
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-researchdesk-dev-only}
    depends_on:
      postgres: {condition: service_healthy}
  ai:
    image: ${RESEARCHDESK_IMAGE_PREFIX:-researchdesk-delivery}-ai:local
    build: {context: .., dockerfile: apps/ai/Dockerfile}
    environment:
      DATABASE_URL: postgresql://researchdesk_retrieval:${RETRIEVAL_DATABASE_PASSWORD:-researchdesk-retrieval-dev-only}@postgres:5432/researchdesk
      REDIS_URL: redis://redis:6379/0
      GENERATION_MODE: ${GENERATION_MODE:-demo}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JAVA_INTERNAL_URL: http://api:8080
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-researchdesk-internal-dev-token-change-before-production}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-researchdesk-dev}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-researchdesk-dev-only}
      STORAGE_BUCKET: researchdesk-documents
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-20971520}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-200}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      minio: {condition: service_healthy}
  web:
    image: ${RESEARCHDESK_IMAGE_PREFIX:-researchdesk-delivery}-web:local
    build: {context: .., dockerfile: apps/web/Dockerfile}
  proxy:
    image: nginx:1.29.1-alpine@sha256:42a516af16b852e33b7682d5ef8acbd5d13fe08fecadc7ed98605ba5e3b26ab8
    ports: ["127.0.0.1:${RESEARCHDESK_PORT:-18085}:8080"]
    volumes: [./proxy.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [api, web]
volumes:
  postgres-data:
  redis-data:
  minio-data:
