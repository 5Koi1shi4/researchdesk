name: verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  unit:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '25'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        shell: pwsh
        run: ./scripts/setup.ps1
      - name: Contracts and unit checks (does not certify deployment)
        shell: pwsh
        run: ./scripts/verify.ps1 -Scope Unit
  # Full acceptance deliberately fails closed until integrated journey is present.
  # Run Foundation/Full locally on isolated Linux-container Docker; hosted Windows
  # runners do not supply the required Linux Docker daemon. Never use untrusted PR
  # code on a privileged self-hosted runner.
