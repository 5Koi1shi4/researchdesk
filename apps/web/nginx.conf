log_format researchdesk_static escape=json '{"requestId":"$request_id","method":"$request_method","status":$status,"duration":$request_time}';
server {
    access_log /var/log/nginx/access.log researchdesk_static;
    error_log /var/log/nginx/error.log crit;
    listen 8080;
    root /usr/share/nginx/html;
    location / { try_files $uri $uri/ /index.html; }
}
